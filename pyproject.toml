[project]
name = "monopoly"
version = "2.0.0"
description = "大富翁 · 联机（局域网 / 互联网 二合一，单进程 Python 服务 + 单文件前端）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # 只依赖标准库：http.server / sqlite3 / threading / struct

[dependency-groups]
dev = ["pyinstaller>=6.0", "ruff>=0.5", "black>=24.0"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
# 规范要求禁止裸 print：T201 一开就报，用 logging（代码里统一走 say()）
select = ["E", "F", "W", "I", "T20"]

[tool.black]
line-length = 120
target-version = ["py39"]
